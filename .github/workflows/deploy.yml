name: Deploy Backend to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --production

    # ✅ Setup SSH properly (IMPORTANT)
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add VPS to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    # ✅ Create backend folder if not exists
    - name: Create backend directory on VPS
      run: |
        ssh root@${{ secrets.VPS_HOST }} "mkdir -p /var/www/skynav/backend"

    # ✅ Upload backend files
    - name: Upload backend files
      run: |
        rsync -avz --delete ./ root@${{ secrets.VPS_HOST }}:/var/www/skynav/backend

    # ✅ Setup backend on VPS
    - name: Configure and Restart Backend
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/skynav/backend || exit 1

          # Install production dependencies
          npm install --production

          # Create .env file
          echo "NODE_ENV=production" > .env
          echo "PORT=5000" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "JWT_EXPIRE=7d" >> .env
          echo "FRONTEND_URL=https://sky-nav.net" >> .env

          # Install PM2 if not installed
          npm install -g pm2

          # Restart App
          pm2 delete skynav-backend || true
          pm2 start server.js --name skynav-backend
          pm2 save
          pm2 startup

          echo "✅ Backend deployed successfully!"
