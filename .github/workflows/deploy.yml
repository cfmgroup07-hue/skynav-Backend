name: Deploy Backend to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout Code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Setup Node
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    # 3️⃣ Install Dependencies (NO LOCK FILE REQUIRED)
    - name: Install dependencies
      run: npm install --production

    # 4️⃣ Setup SSH Agent
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    # 5️⃣ Add VPS to known hosts
    - name: Add VPS to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    # 6️⃣ Create Backend Folder
    - name: Create backend directory on VPS
      run: |
        ssh root@${{ secrets.VPS_HOST }} "mkdir -p /var/www/skynav/backend"

    # 7️⃣ Upload Files via rsync
    - name: Upload backend files
      run: |
        rsync -avz --delete ./ root@${{ secrets.VPS_HOST }}:/var/www/skynav/backend

    # 8️⃣ Setup Backend & Restart PM2
    - name: Configure and Restart Backend
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/skynav/backend || exit 1

          # Install dependencies on server
          npm install --production

          # Create .env file
          echo "NODE_ENV=production" > .env
          echo "PORT=5000" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "JWT_EXPIRE=7d" >> .env
          echo "FRONTEND_URL=https://sky-nav.net" >> .env

          # Install PM2 globally (if not installed)
          npm install -g pm2

          # Restart Backend
          pm2 delete skynav-backend || true
          pm2 start server.js --name skynav-backend
          pm2 save

          echo "✅ Backend deployed successfully!"
